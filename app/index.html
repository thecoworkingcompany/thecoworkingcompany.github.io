<meta name="description" content="The Coworking Company member app: book rooms, invite guests, order from BREAK, raise requests and see invoices.">
<meta name="theme-color" content="#EDEBDE">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600&family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The member app, running in a browser. The app is light-only by brand choice (userInterfaceStyle: light), so the page stays light in both modes. */
:root{--beige:#EDEBDE;--paper:#F8F6EE;--ink:#123C51;--soft:#4B6676;--line:#D9D8CB;--tomato:#F5634A;--err:#B23A24;--outer:#DCD9C9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outer:#0D1F2A}}
:root[data-theme="dark"]{--outer:#0D1F2A}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:"Familjen Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100dvh;display:flex;flex-direction:column}
.app-col{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.app-col>div:first-child{flex:1;min-height:0}
.stack-screen{flex:1;display:flex;flex-direction:column;min-height:0}
.stack-body{flex:1;display:flex;flex-direction:column;min-height:0}
.stack-head{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 6px;flex:none;padding-top:env(safe-area-inset-top,0px)}
.stack-head .back{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:inherit;cursor:pointer}
.stack-title{font:600 16px "Familjen Grotesk",system-ui,sans-serif}
.tabs{flex:1;display:flex;flex-direction:column;min-height:0}
.tab-body{flex:1;display:flex;flex-direction:column;min-height:0}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:2px;background:none;border:0;cursor:pointer;font:600 11px "Familjen Grotesk",system-ui,sans-serif;padding:4px 0;min-height:48px}
.tab.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--tomato);margin-top:1px}
.modal-layer{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .18s ease}
.sheet-layer{position:fixed;top:0;bottom:0;left:50%;width:min(520px,100%);transform:translateX(-50%)}
.sheet-layer>div:last-child{max-height:90%;overflow-y:auto;animation:up .22s cubic-bezier(.2,.7,.2,1)}
.modal-layer.center{position:fixed;justify-content:center;align-items:center;padding:16px}
.modal-layer.center>.scrim{position:absolute;inset:0;background:rgba(10,20,26,.45)}
.alert{position:relative;background:var(--beige);max-width:340px;width:100%;padding:22px 20px 16px;border:1.5px solid var(--ink);animation:up .18s ease}
.alert-title{font:600 28px/1 "Darker Grotesque",sans-serif}
.alert-msg{font:400 14.5px/1.45 "Familjen Grotesk",sans-serif;color:var(--soft);margin-top:10px}
.alert-btns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.alert-btn{font:600 15px "Familjen Grotesk",sans-serif;padding:13px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.alert-btn.destructive{background:var(--err);border-color:var(--err);color:#fff}
.alert-btn.default{background:var(--tomato);border-color:var(--tomato);color:#1b0d09}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--beige);font:600 13px "Familjen Grotesk",sans-serif;padding:11px 14px;z-index:60;max-width:min(440px,calc(100% - 32px))}
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid;border-radius:50%;animation:rot .8s linear infinite}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.vscroll{scrollbar-width:thin}
input::placeholder,textarea::placeholder{color:#8A9AA3;opacity:1}
input,textarea,button{font-family:inherit}
[role=button]:focus-visible,[role=tab]:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tomato);outline-offset:2px}
.boot{flex:1;display:grid;place-items:center;font:500 13px "IBM Plex Mono",monospace;color:var(--soft);background:var(--beige);max-width:520px;width:100%;margin:0 auto;text-align:center;padding:24px;box-sizing:border-box}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
